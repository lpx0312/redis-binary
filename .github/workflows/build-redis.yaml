---
name: BuildRedis

on:
  workflow_dispatch:
    inputs:
      redis_version:
        description: 'Redis version to build (e.g. 7.4.1)'
        required: true
        default: '7.4.1'
  push:
    tags:
      - 'v*'

# Fork repo needs explicit write permission to create/update the
# release and its tag.
permissions:
  contents: write

jobs:
  build-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prepare
        id: prepare
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.redis_version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid redis version: $VERSION" && exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build redis binaries to local
        uses: docker/build-push-action@v7
        with:
          context: build
          file: build/dockerfile.redis
          platforms: linux/amd64,linux/arm64
          build-args: |
            REDIS_VERSION=${{ steps.prepare.outputs.version }}
          outputs: type=local,dest=./output

      - name: Prepare for upload
        shell: bash
        run: |
          VERSION=${{ steps.prepare.outputs.version }}
          mv ./output/linux_amd64/redis-${VERSION}-linux-amd64.tar.gz .
          mv ./output/linux_arm64/redis-${VERSION}-linux-arm64.tar.gz .
          sha256sum redis-${VERSION}-linux-*.tar.gz > redis-${VERSION}.sha256sum.txt

      - name: Release and upload redis packages
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.prepare.outputs.version }}
          name: v${{ steps.prepare.outputs.version }}
          files: |
            redis-${{ steps.prepare.outputs.version }}-linux-amd64.tar.gz
            redis-${{ steps.prepare.outputs.version }}-linux-arm64.tar.gz
            redis-${{ steps.prepare.outputs.version }}.sha256sum.txt
          overwrite: true
